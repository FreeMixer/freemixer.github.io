name: Prune selection tests

on:
  pull_request:
    paths: ['keep.yml', '.github/prune/**', '.github/workflows/prune*.yml']
  push:
    branches: [main]
    paths: ['keep.yml', '.github/prune/**', '.github/workflows/prune*.yml']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            keep.yml
            .github
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test .github/prune/test/*.test.mjs
