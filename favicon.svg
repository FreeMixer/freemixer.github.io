<svg width="96" height="96" viewBox="0 0 96 96" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="openmixer mark">
  <!-- openmixer mark: three fader strips, caps at level-meter heights, the
       middle one lit at unity. The motif IS the brand — a console fader wall. -->
  <rect x="0.5" y="0.5" width="95" height="95" rx="20" fill="#0b0e11" stroke="#2a323b"/>

  <!-- unity reference line (0 dB), faint -->
  <line x1="22" y1="46" x2="74" y2="46" stroke="#2a323b" stroke-width="1.5" stroke-dasharray="2 3"/>

  <g stroke-linecap="round">
    <!-- strip 1 -->
    <line x1="28" y1="20" x2="28" y2="76" stroke="#242b33" stroke-width="6"/>
    <line x1="28" y1="58" x2="28" y2="76" stroke="#28c8e6" stroke-width="6" opacity="0.55"/>
    <rect x="22" y="54" width="12" height="8" rx="3" fill="#cfd9e0"/>
    <line x1="24.5" y1="58" x2="31.5" y2="58" stroke="#0b0e11" stroke-width="1.5"/>

    <!-- strip 2 (lit, near top — the accent moment) -->
    <line x1="48" y1="20" x2="48" y2="76" stroke="#242b33" stroke-width="6"/>
    <line x1="48" y1="30" x2="48" y2="76" stroke="#28c8e6" stroke-width="6"/>
    <rect x="42" y="26" width="12" height="8" rx="3" fill="#28c8e6"/>
    <line x1="44.5" y1="30" x2="51.5" y2="30" stroke="#04161c" stroke-width="1.5"/>

    <!-- strip 3 -->
    <line x1="68" y1="20" x2="68" y2="76" stroke="#242b33" stroke-width="6"/>
    <line x1="68" y1="66" x2="68" y2="76" stroke="#28c8e6" stroke-width="6" opacity="0.4"/>
    <rect x="62" y="62" width="12" height="8" rx="3" fill="#cfd9e0"/>
    <line x1="64.5" y1="66" x2="71.5" y2="66" stroke="#0b0e11" stroke-width="1.5"/>
  </g>
</svg>
